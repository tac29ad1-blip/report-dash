<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AffiliateReport</title>
<style>
:root{--bg:#FAF6F2;--surface:#FFFFFF;--ink:#2B211B;--muted:#85756A;--line:#EBE0D8;--accent:#D6431F;--accent-ink:#B53717}
@media (prefers-color-scheme:dark){:root{--bg:#201A16;--surface:#2A231E;--ink:#F1E8E1;--muted:#A08F83;--line:#3D332C;--accent:#F07A52;--accent-ink:#F49272}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI","Leelawadee UI",Tahoma,sans-serif}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 30px;max-width:360px;width:calc(100% - 32px);box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{width:100%;margin-top:12px;font-size:16px;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--accent-ink);font-size:14px;margin-top:10px;display:none}
.remember{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.remember input{width:auto;margin:0;accent-color:var(--accent)}
#auto{display:none;text-align:center;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>AffiliateReport</h1>
  <p>ใส่รหัสผ่านเพื่อเปิดรายงาน</p>
  <input type="password" id="pw" autocomplete="current-password" autofocus aria-label="รหัสผ่าน">
  <label class="remember"><input type="checkbox" id="remember" checked> จำรหัสในเบราว์เซอร์นี้</label>
  <button id="btn" type="submit">เปิดรายงาน</button>
  <div class="err" id="err">รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง</div>
</form>
<div class="card" id="auto">กำลังเปิดรายงาน…</div>

const PWKEY='affreport_pw';
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
const form=$('f'),btn=$('btn'),err=$('err'),auto=$('auto');
// localStorage อาจโยน (โหมดไม่มี storage / บล็อกคุกกี้) — ห่อ try/catch ทุกจุด
const pwGet=()=>{try{return localStorage.getItem(PWKEY)}catch(e){return null}};
const pwSet=v=>{try{localStorage.setItem(PWKEY,v)}catch(e){}};
const pwDel=()=>{try{localStorage.removeItem(PWKEY)}catch(e){}};
// ลิงก์ "ลืมรหัสในเครื่องนี้" ที่แปะเข้าไปในรายงาน (IIFE ไม่ให้ตัวแปรชนกับสคริปต์ของรายงาน)
const FORGET='<script>(function(){var a=document.createElement("a");a.href="#";a.textContent="ลืมรหัสในเครื่องนี้";'
  +'a.style.cssText="position:fixed;right:12px;bottom:10px;font-size:12px;opacity:.6;z-index:2147483647;color:inherit;text-decoration:underline";'
  +'a.onclick=function(e){e.preventDefault();try{localStorage.removeItem("affreport_pw")}catch(x){}location.reload();};'
  +'document.body.appendChild(a);})();<\/script>';
const show=html=>{
  const out=html.replace(/<\/body>/i,()=>FORGET+'</body>');
  document.open();document.write(out);document.close();
};
const decrypt=async pw=>{
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(DATA)));
};
form.addEventListener('submit',async ev=>{
  ev.preventDefault();
  btn.disabled=true;err.style.display='none';
  const pw=$('pw').value;
  try{
    const html=await decrypt(pw);
    if($('remember').checked)pwSet(pw);else pwDel();
    show(html);
  }catch(e){err.textContent='รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง';err.style.display='block';btn.disabled=false;}
});
